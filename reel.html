<!DOCTYPE html>

<title>Reel — Will Labeaux</title>
<link rel="stylesheet" href="css/style.css">
<style>
.reel-block {
  padding: calc(var(--nav-h) + 48px) 48px 64px;
}
.reel-block + .reel-block {
  border-top: 1px solid var(--border);
  padding-top: 48px;
  padding-bottom: 64px;
}
.reel-label {
  font-size: 10px; letter-spacing: .25em; text-transform: uppercase;
  color: var(--muted); margin-bottom: 16px; display: block;
}
.reel-video {
  position: relative; width: 100%;
  background: var(--surface); overflow: hidden;
  padding-bottom: 56.25%; height: 0;
}
.reel-video iframe {
  position: absolute; top: 0; left: 0;
  width: 100%; height: 100%; border: none;
}
@media (max-width: 768px) {
  .reel-block { padding: calc(var(--nav-h) + 32px) 24px 48px; }
  .reel-block + .reel-block { padding-top: 40px; padding-bottom: 48px; }
}
</style>
</head>
