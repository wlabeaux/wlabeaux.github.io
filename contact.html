<title>Contact — Will Labeaux</title>
<link rel="stylesheet" href="css/style.css">
<style>
body { min-height: 100vh; display: flex; flex-direction: column; }

.contact-body {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  text-align: center; padding: 80px 48px;
  gap: 32px;
}
.contact-eyebrow {
  font-size: 10px; letter-spacing: .3em; text-transform: uppercase;
  color: var(--accent);
}
.contact-title {
  font-family: var(--font-display);
  font-size: clamp(48px, 8vw, 96px); line-height: .92;
  letter-spacing: .02em; color: var(--text);
}
.email-link {
  font-size: 13px; letter-spacing: .15em; text-transform: uppercase;
  color: rgba(240,236,227,0.6); text-decoration: none;
  border-bottom: 1px solid #2a2a2a; padding-bottom: 4px;
  transition: color .2s, border-color .2s;
}
.email-link:hover { color: var(--accent); border-color: var(--accent); }

.divider { width: 1px; height: 32px; background: var(--border); }

.social-links { display: flex; gap: 24px; flex-wrap: wrap; justify-content: center; }
.social-links a {
  font-size: 10px; letter-spacing: .2em; text-transform: uppercase;
  color: rgba(240,236,227,0.45); text-decoration: none; transition: color .2s;
}
.social-links a:hover { color: var(--accent); }

@media (max-width: 768px) {
  .contact-body { padding: 60px 24px; }
}
</style>
</head>
